[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hisaab"
version = "0.1.0"
description = "Grade Indian finfluencer stock tips against actual market outcomes. Hisaab keeps the receipts."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Darshan Rajagoli", email = "darshanrajagoli@users.noreply.github.com"},
]
keywords = ["serpapi", "finance", "youtube", "stock-tips", "india", "finfluencer"]

dependencies = [
    "google-search-results>=2.4.2",
    "httpx>=0.27",
    "pydantic>=2.5",
    "anthropic>=0.40",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "rapidfuzz>=3.5",
    "typer>=0.12",
    "rich>=13.7",
    "streamlit>=1.30",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[project.scripts]
hisaab = "hisaab.cli:app"

[tool.setuptools.packages.find]
include = ["hisaab*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
